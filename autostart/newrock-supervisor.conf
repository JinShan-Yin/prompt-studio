; ============================================================
; NewRock AI Workbench · supervisord 配置
; 适用：容器 / 云沙箱 / 无 systemd 的 Linux，或已有 supervisord 的机器
;
; 【用法 A】独立启动（机器上没有 supervisord）
;     supervisord -c autostart/newrock-supervisor.conf -d
;     supervisorctl -c autostart/newrock-supervisor.conf status
;
; 【用法 B】已有 supervisord（如 /etc/supervisord.conf）
;     只复制下面 [program:newrock] 这**一段**，追加到已有配置末尾，
;     不要复制 [supervisord] / [unix_http_server] 等段，否则段重复会报错。
;     然后：supervisorctl reread && supervisorctl update
;
; 注意：directory 与 command 的 node 路径请按实际修改。
; ============================================================

[unix_http_server]
file=/tmp/newrock_supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
logfile=/var/log/newrock/supervisord.log
pidfile=/tmp/newrock_supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/newrock_supervisor.sock

; ---------- 以下为唯一需要追加到已有配置的段 ----------
[program:newrock]
directory=/opt/newrock-ai-workbench
command=/usr/bin/node server.js
; 端口：必须与项目 .env 的 PORT 一致
environment=NODE_ENV="production",PORT="3100"
autostart=true
autorestart=true
startsecs=5
startretries=10
; server.js 监听 SIGTERM，给足优雅退出时间
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/newrock/newrock.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
