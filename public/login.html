<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewRock AI Workbench · 登录</title>
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root {
    --brand: #4d6bfe;
    --brand-hover: #3b5bdb;
    --border: #e6e8ec;
    --text: #0f172a;
    --text-secondary: #6b7280;
    --muted: #94a3b8;
    --bg: #fbfcfd;
    --field-bg: #f4f5f7;
    --danger: #ef4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 48px 24px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* 品牌区：在卡片之外；logo 与产品名同一行，按 baseline 对齐后整体居中。
     logo 图为紧裁图（文字底边贴图片底边），故 baseline 对齐 = 与 logo 内文字底部齐平。
     字号按 logo 内大写字母高度换算：图片高 1827px、大写高 538px（0.2944H），
     H=44px → cap 12.95px → font-size 18px（Segoe UI cap≈0.72em）。 */
  .login-brand {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
    gap: 16px;
    margin-bottom: 26px;
  }
  .login-brand img {
    height: 44px;
    width: auto;
    display: block;
    mix-blend-mode: multiply;
  }
  .login-brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #0c479b;
    white-space: nowrap;
  }

  /* 卡片：只有表单，不含任何品牌元素/图片 */
  .login-card {
    width: 400px;
    max-width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px 26px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  }

  .msg { min-height: 20px; margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: #16a34a; }

  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 14px; }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--field-bg);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .field input::placeholder { color: #9aa3b2; }
  .field input:focus {
    background: #fff;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(77, 107, 254, .15);
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .btn-primary {
    width: 100%;
    height: 44px;
    margin-top: 6px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  .btn-primary:hover { background: var(--brand-hover); box-shadow: 0 6px 16px rgba(77, 107, 254, .22); }
  .btn-primary:active { transform: scale(.995); }
  .btn-primary:disabled { opacity: .65; cursor: not-allowed; box-shadow: none; }
  .btn-text {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 8px 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: color .18s ease;
  }
  .btn-text:hover { color: var(--text); }

  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 14px 0 0; text-align: center; }
  .hint-bottom { margin: 18px 0 0; }
  .link-row { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-secondary); }
  .link-row a { color: var(--brand); text-decoration: none; cursor: pointer; }
  .link-row a:hover { text-decoration: underline; }

  .pwd-tip {
    display: none;
    margin: 0 0 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    font-size: 13px;
    line-height: 1.6;
  }

  .login-foot {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 520px) {
    body { padding: 32px 16px 28px; justify-content: flex-start; }
    .login-brand { margin-bottom: 20px; gap: 12px; }
    .login-brand img { height: 30px; }
    .login-brand-name { font-size: 12px; }
    .login-card { width: 100%; padding: 26px 20px 22px; border-radius: 14px; }
  }
</style>
</head>
<body>
  <!-- 品牌区：卡片之外 -->
  <header class="login-brand">
    <img src="/logo.png" alt="NEWROCK 迅时" onerror="this.style.display='none'" />
    <span class="login-brand-name">AI Workbench</span>
  </header>

  <main class="login-card">
    <div id="msg" class="msg"></div>

    <div id="login-panel" class="panel active">
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label class="sr-only" for="login-username">手机号 / 邮箱</label>
          <input id="login-username" type="text" name="username" placeholder="请输入手机号或邮箱" autocomplete="username" />
        </div>
        <div class="field">
          <label class="sr-only" for="login-password">密码</label>
          <input id="login-password" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button id="login-submit" class="btn-primary" type="submit">登 录</button>
        <p class="hint hint-bottom" id="register-closed-hint" style="display:none;">如需创建账号，请联系管理员</p>
        <div class="link-row" id="register-entry" style="display:none;">还没有账号？<a id="register-link" role="button" tabindex="0">注册</a></div>
      </form>
    </div>

    <div id="register-panel" class="panel">
      <form id="register-form" autocomplete="on">
        <div class="field">
          <label class="sr-only" for="reg-username">手机号 / 邮箱</label>
          <input id="reg-username" type="text" name="username" placeholder="请输入手机号或邮箱" autocomplete="username" />
        </div>
        <div class="field">
          <label class="sr-only" for="reg-password">密码</label>
          <input id="reg-password" type="password" name="password" placeholder="至少 6 位密码" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="sr-only" for="reg-confirm">确认密码</label>
          <input id="reg-confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password" />
        </div>
        <button id="register-submit" class="btn-primary" type="submit">注 册</button>
        <p class="hint">注册后为普通用户，可先用公共 Key 试用 3 次；如需更多额度请配置自己的 API Key。</p>
        <div class="link-row">已有账号？<a id="back-to-login" role="button" tabindex="0">登录</a></div>
      </form>
    </div>

    <div id="pwd-panel" class="panel">
      <div class="pwd-tip" id="pwd-tip">检测到你正在使用默认密码，为了账号安全，请立即修改密码（也可稍后再说）。</div>
      <form id="pwd-form">
        <div class="field">
          <label class="sr-only" for="pwd-old">原密码</label>
          <input id="pwd-old" type="password" placeholder="请输入当前密码" autocomplete="current-password" />
        </div>
        <div class="field">
          <label class="sr-only" for="pwd-new">新密码</label>
          <input id="pwd-new" type="password" placeholder="至少 6 位新密码" autocomplete="new-password" />
        </div>
        <div class="field">
          <label class="sr-only" for="pwd-confirm">确认新密码</label>
          <input id="pwd-confirm" type="password" placeholder="请再次输入新密码" autocomplete="new-password" />
        </div>
        <button id="pwd-submit" class="btn-primary" type="submit">保存新密码并进入</button>
        <button id="pwd-skip" class="btn-text" type="button">稍后再说，直接进入</button>
      </form>
    </div>
  </main>

  <footer class="login-foot">AI Workbench · 仅限本机或局域网内访问</footer>

<script>
(function () {
  var msgEl = document.getElementById('msg');
  var panels = {
    login: document.getElementById('login-panel'),
    register: document.getElementById('register-panel'),
    pwd: document.getElementById('pwd-panel')
  };
  function setMsg(text, type) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (type ? ' ' + type : '');
  }
  function showPanel(name) {
    Object.keys(panels).forEach(function (key) { panels[key].classList.toggle('active', key === name); });
    if (name === 'login') document.getElementById('login-username').focus();
    if (name === 'register') document.getElementById('reg-username').focus();
  }
  var registerLink = document.getElementById('register-link');
  if (registerLink) {
    registerLink.addEventListener('click', function () { setMsg(''); showPanel('register'); });
    registerLink.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setMsg(''); showPanel('register'); }
    });
  }
  var backToLogin = document.getElementById('back-to-login');
  if (backToLogin) {
    backToLogin.addEventListener('click', function () { setMsg(''); showPanel('login'); });
    backToLogin.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setMsg(''); showPanel('login'); }
    });
  }
  function isPhoneOrEmail(value) {
    return /^(1[3-9]\d{9}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(String(value || '').trim());
  }
  async function postJson(url, payload) {
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { status: res.status, data: data || {} };
  }
  var pendingUser = null;
  function enterApp() { window.location.href = '/'; }
  function afterLogin(data) {
    pendingUser = data.user || {};
    if (Number(pendingUser.need_change_password) === 1) {
      showPanel('pwd');
      document.getElementById('pwd-old').value = '';
      document.getElementById('pwd-tip').style.display = 'block';
      setMsg('登录成功，请修改默认密码', 'ok');
    } else {
      enterApp();
    }
  }
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    if (!isPhoneOrEmail(username) && username !== 'admin') return setMsg('请输入正确的手机号或邮箱', 'error');
    if (!password) return setMsg('请输入密码', 'error');
    var btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = '登录中...';
    try {
      var ret = await postJson('/api/auth/login', { username: username, password: password });
      if (ret.status === 200 && ret.data.success) { setMsg('登录成功', 'ok'); afterLogin(ret.data); }
      else setMsg(ret.data.error || '登录失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '登 录'; }
  });
  document.getElementById('register-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('reg-username').value.trim();
    var password = document.getElementById('reg-password').value;
    var confirm = document.getElementById('reg-confirm').value;
    if (!isPhoneOrEmail(username)) return setMsg('请输入正确的手机号或邮箱', 'error');
    if (password.length < 6) return setMsg('密码至少 6 位', 'error');
    if (password !== confirm) return setMsg('两次输入的密码不一致', 'error');
    var btn = document.getElementById('register-submit');
    btn.disabled = true; btn.textContent = '注册中...';
    try {
      var ret = await postJson('/api/auth/register', { username: username, password: password });
      if (ret.status === 200 && ret.data.success) { setMsg('注册成功，正在进入...', 'ok'); afterLogin(ret.data); }
      else setMsg(ret.data.error || '注册失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '注 册'; }
  });
  document.getElementById('pwd-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var oldPassword = document.getElementById('pwd-old').value;
    var newPassword = document.getElementById('pwd-new').value;
    var confirm = document.getElementById('pwd-confirm').value;
    if (!oldPassword) return setMsg('请输入原密码', 'error');
    if (newPassword.length < 6) return setMsg('新密码至少 6 位', 'error');
    if (newPassword !== confirm) return setMsg('两次输入的新密码不一致', 'error');
    var btn = document.getElementById('pwd-submit');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      var ret = await postJson('/api/auth/change-password', { old_password: oldPassword, new_password: newPassword });
      if (ret.status === 200 && ret.data.success) { setMsg('密码已修改，正在进入...', 'ok'); enterApp(); }
      else setMsg(ret.data.error || '修改失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '保存新密码并进入'; }
  });
  document.getElementById('pwd-skip').addEventListener('click', enterApp);
  // 已登录用户访问 login.html 直接进入
  fetch('/api/auth/me').then(function (r) { return r.json(); }).then(function (d) { if (d && d.success) window.location.href = '/'; }).catch(function () {});
  // V1.62：按服务端配置决定是否显示注册入口（局域网模式默认关闭）
  fetch('/api/auth/config').then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.success) return;
    var data = d.data || {};
    if (data.register_enabled === false) {
      var entry = document.getElementById('register-entry');
      if (entry) entry.style.display = 'none';
      if (panels.register) panels.register.classList.remove('active');
      var closedHint = document.getElementById('register-closed-hint');
      if (closedHint) closedHint.style.display = 'block';
      showPanel('login');
    } else {
      var entryOpen = document.getElementById('register-entry');
      if (entryOpen) entryOpen.style.display = 'block';
    }
    var foot = document.querySelector('.login-foot');
    if (foot) foot.textContent = 'AI Workbench v' + (data.version || '1.65.1') + (data.lan_mode ? ' · 局域网模式' : ' · 仅限本机访问');
  }).catch(function () {});
  showPanel('login');
})();
</script>
</body>
</html>
