<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewRock AI Workbench · 登录</title>
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root {
    --brand: #4d6bfe;
    --brand-hover: #3b5bdb;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --bg: #f7f9fc;
    --danger: #ef4444;
    --radius: 16px;
    --shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, #eef2ff 0%, transparent 60%),
                radial-gradient(1000px 500px at 100% 100%, #e0f2fe 0%, transparent 55%), var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .auth-shell { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; background: #fff; border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #eef2f7; }
  .brand-panel { padding: 48px 44px; background: linear-gradient(160deg, #eef2ff 0%, #f8fbff 55%, #eff6ff 100%); display: flex; flex-direction: column; justify-content: space-between; }
  .brand-logo { display: flex; align-items: center; gap: 12px; }
  .brand-logo img { width: 128px; height: auto; display: block; }
  .brand-title { margin: 34px 0 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-sub { color: var(--text-secondary); font-size: 14px; line-height: 1.9; }
  .brand-points { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .brand-point { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #475569; }
  .brand-point i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); display: inline-block; }
  .brand-foot { margin-top: 40px; font-size: 12px; color: #94a3b8; }
  .form-panel { padding: 46px 40px; display: flex; flex-direction: column; justify-content: center; }
  .tabs { display: flex; gap: 8px; background: #f3f5f9; padding: 4px; border-radius: 10px; margin-bottom: 26px; }
  .tab { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all .2s ease; }
  .tab.active { background: #fff; color: var(--brand); box-shadow: 0 1px 3px rgba(15,23,42,.08); }
  .panel { display: none; }
  .panel.active { display: block; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
  .field input { width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text); background: #fff; outline: none; transition: all .2s ease; }
  .field input::placeholder { color: #a3adbc; }
  .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(77, 107, 254, .15); }
  .btn-primary { width: 100%; height: 44px; border: none; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s ease; margin-top: 6px; }
  .btn-primary:hover { background: var(--brand-hover); box-shadow: 0 6px 16px rgba(77, 107, 254, .22); }
  .btn-primary:active { transform: scale(.99); }
  .btn-primary:disabled { opacity: .65; cursor: not-allowed; }
  .btn-ghost { width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text-secondary); font-size: 13px; cursor: pointer; margin-top: 10px; transition: all .2s ease; }
  .btn-ghost:hover { background: #f9fafb; color: var(--text); }
  .msg { min-height: 20px; margin: 4px 0 10px; font-size: 13px; line-height: 1.5; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: #16a34a; }
  .hint { font-size: 12px; color: #94a3b8; line-height: 1.7; margin-top: 14px; }
  .pwd-tip { display: none; margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; font-size: 13px; line-height: 1.6; }
  @media (max-width: 760px) {
    .auth-shell { grid-template-columns: 1fr; }
    .brand-panel { padding: 30px 26px; }
    .form-panel { padding: 30px 26px; }
    .brand-points, .brand-foot { display: none; }
  }
</style>
</head>
<body>
<div class="auth-shell">
  <section class="brand-panel">
    <div>
      <div class="brand-logo">
        <img src="/logo.png" alt="NewRock" onerror="this.style.display='none'" />
      </div>
      <h1 class="brand-title">NewRock AI Workbench</h1>
      <p class="brand-sub">企业级多租户提示词协作与资产管理平台<br />登录后进入你的提示词工作台</p>
      <div class="brand-points">
        <div class="brand-point"><i></i>多租户数据隔离，团队协作更安全</div>
        <div class="brand-point"><i></i>提示词分层编辑、知识库与快照资产化</div>
        <div class="brand-point"><i></i>AI 润色 / 模板库 / 回归评测一站式</div>
      </div>
    </div>
    <div class="brand-foot">NewRock AI Workbench v1.60 · 仅限本机访问</div>
  </section>

  <section class="form-panel">
    <div class="tabs">
      <button class="tab active" type="button" data-panel="login">登录</button>
      <button class="tab" type="button" data-panel="register">注册</button>
    </div>

    <div id="msg" class="msg"></div>

    <div id="login-panel" class="panel active">
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-username">手机号 / 邮箱</label>
          <input id="login-username" type="text" name="username" placeholder="请输入手机号或邮箱" autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">密码</label>
          <input id="login-password" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <button id="login-submit" class="btn-primary" type="submit">登 录</button>
        <p class="hint">首次部署可用默认超管账号登录，登录后系统会提醒修改密码。</p>
      </form>
    </div>

    <div id="register-panel" class="panel">
      <form id="register-form" autocomplete="on">
        <div class="field">
          <label for="reg-username">手机号 / 邮箱</label>
          <input id="reg-username" type="text" name="username" placeholder="请输入手机号或邮箱" autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-password">密码</label>
          <input id="reg-password" type="password" name="password" placeholder="至少 6 位密码" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="reg-confirm">确认密码</label>
          <input id="reg-confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password" />
        </div>
        <button id="register-submit" class="btn-primary" type="submit">注 册</button>
        <p class="hint">注册后为普通用户，可先用公共 Key 试用 3 次；如需更多额度请配置自己的 API Key。</p>
      </form>
    </div>

    <div id="pwd-panel" class="panel">
      <div class="pwd-tip" id="pwd-tip">检测到你正在使用默认密码，为了账号安全，请立即修改密码（也可稍后再说）。</div>
      <form id="pwd-form">
        <div class="field">
          <label for="pwd-old">原密码</label>
          <input id="pwd-old" type="password" placeholder="请输入当前密码" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="pwd-new">新密码</label>
          <input id="pwd-new" type="password" placeholder="至少 6 位新密码" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="pwd-confirm">确认新密码</label>
          <input id="pwd-confirm" type="password" placeholder="请再次输入新密码" autocomplete="new-password" />
        </div>
        <button id="pwd-submit" class="btn-primary" type="submit">保存新密码并进入</button>
        <button id="pwd-skip" class="btn-ghost" type="button">稍后再说，直接进入</button>
      </form>
    </div>
  </section>
</div>

<script>
(function () {
  var msgEl = document.getElementById('msg');
  var panels = {
    login: document.getElementById('login-panel'),
    register: document.getElementById('register-panel'),
    pwd: document.getElementById('pwd-panel')
  };
  var tabs = document.querySelectorAll('.tab');
  function setMsg(text, type) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (type ? ' ' + type : '');
  }
  function showPanel(name) {
    Object.keys(panels).forEach(function (key) { panels[key].classList.toggle('active', key === name); });
    tabs.forEach(function (tab) { tab.classList.toggle('active', tab.getAttribute('data-panel') === name); });
    if (name === 'login') document.getElementById('login-username').focus();
    if (name === 'register') document.getElementById('reg-username').focus();
  }
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { setMsg(''); showPanel(tab.getAttribute('data-panel')); });
  });
  function isPhoneOrEmail(value) {
    return /^(1[3-9]\d{9}|[^\s@]+@[^\s@]+\.[^\s@]+)$/.test(String(value || '').trim());
  }
  async function postJson(url, payload) {
    var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { status: res.status, data: data || {} };
  }
  var pendingUser = null;
  function enterApp() { window.location.href = '/'; }
  function afterLogin(data) {
    pendingUser = data.user || {};
    if (Number(pendingUser.need_change_password) === 1) {
      showPanel('pwd');
      document.getElementById('pwd-old').value = '';
      document.getElementById('pwd-tip').style.display = 'block';
      setMsg('登录成功，请修改默认密码', 'ok');
    } else {
      enterApp();
    }
  }
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    if (!isPhoneOrEmail(username) && username !== 'admin') return setMsg('请输入正确的手机号或邮箱', 'error');
    if (!password) return setMsg('请输入密码', 'error');
    var btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = '登录中...';
    try {
      var ret = await postJson('/api/auth/login', { username: username, password: password });
      if (ret.status === 200 && ret.data.success) { setMsg('登录成功', 'ok'); afterLogin(ret.data); }
      else setMsg(ret.data.error || '登录失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '登 录'; }
  });
  document.getElementById('register-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('reg-username').value.trim();
    var password = document.getElementById('reg-password').value;
    var confirm = document.getElementById('reg-confirm').value;
    if (!isPhoneOrEmail(username)) return setMsg('请输入正确的手机号或邮箱', 'error');
    if (password.length < 6) return setMsg('密码至少 6 位', 'error');
    if (password !== confirm) return setMsg('两次输入的密码不一致', 'error');
    var btn = document.getElementById('register-submit');
    btn.disabled = true; btn.textContent = '注册中...';
    try {
      var ret = await postJson('/api/auth/register', { username: username, password: password });
      if (ret.status === 200 && ret.data.success) { setMsg('注册成功，正在进入...', 'ok'); afterLogin(ret.data); }
      else setMsg(ret.data.error || '注册失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '注 册'; }
  });
  document.getElementById('pwd-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var oldPassword = document.getElementById('pwd-old').value;
    var newPassword = document.getElementById('pwd-new').value;
    var confirm = document.getElementById('pwd-confirm').value;
    if (!oldPassword) return setMsg('请输入原密码', 'error');
    if (newPassword.length < 6) return setMsg('新密码至少 6 位', 'error');
    if (newPassword !== confirm) return setMsg('两次输入的新密码不一致', 'error');
    var btn = document.getElementById('pwd-submit');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      var ret = await postJson('/api/auth/change-password', { old_password: oldPassword, new_password: newPassword });
      if (ret.status === 200 && ret.data.success) { setMsg('密码已修改，正在进入...', 'ok'); enterApp(); }
      else setMsg(ret.data.error || '修改失败', 'error');
    } catch (err) { setMsg('网络异常：' + err.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '保存新密码并进入'; }
  });
  document.getElementById('pwd-skip').addEventListener('click', enterApp);
  // 已登录用户访问 login.html 直接进入
  fetch('/api/auth/me').then(function (r) { return r.json(); }).then(function (d) { if (d && d.success) window.location.href = '/'; }).catch(function () {});
  showPanel('login');
})();
</script>
</body>
</html>
